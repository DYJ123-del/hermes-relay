name: Build APK (manual)

# Fork-local build lane: the upstream ci-android workflow only fires on
# push/pull_request events the fork cannot always raise. This lane exists so a
# dispatcher can produce a debug APK on demand from any branch of this fork.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build debug APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.0

      - name: Build debug APK
        run: ./gradlew assembleDebug --console=plain

      # Fixed release keystore → every build from this fork shares one signing
      # identity, so releases upgrade over each other instead of demanding an
      # uninstall. Absent secrets fall back to the debug keystore (build.gradle.kts).
      - name: Decode release keystore
        env:
          HERMES_KEYSTORE_BASE64: ${{ secrets.HERMES_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$HERMES_KEYSTORE_BASE64" ]; then
            echo "$HERMES_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "HERMES_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "release keystore decoded"
          else
            echo "no keystore secret — falling back to the debug signing config"
          fi

      - name: Build release APK (R8)
        env:
          HERMES_KEYSTORE_PASSWORD: ${{ secrets.HERMES_KEYSTORE_PASSWORD }}
          HERMES_KEY_ALIAS: ${{ secrets.HERMES_KEY_ALIAS }}
          HERMES_KEY_PASSWORD: ${{ secrets.HERMES_KEY_PASSWORD }}
        run: ./gradlew assembleSideloadRelease --console=plain

      - name: List built APKs
        run: find app/build/outputs/apk -name "*.apk" -printf "%p %s bytes\n"

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: hermes-relay-debug-apk
          path: app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: hermes-relay-release-apk
          path: app/build/outputs/apk/sideload/release/*.apk
          if-no-files-found: error
          retention-days: 14
